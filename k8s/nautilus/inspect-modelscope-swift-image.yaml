apiVersion: batch/v1
kind: Job
metadata:
  name: wenfei-modelscope-swift-image-inspect-20260713
  namespace: nsf-maica
  labels:
    app: wenfei-modelscope-swift-image-inspect-20260713
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wenfei-modelscope-swift-image-inspect-20260713
    spec:
      restartPolicy: Never
      containers:
      - name: inspect
        image: modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope:ubuntu22.04-cuda12.8.1-py311-torch2.9.0-vllm0.13.0-modelscope1.33.0-swift3.12.5
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        - |
          set -Eeuo pipefail
          echo "PYTHON=$(command -v python3)"
          python3 -V
          python3 - <<'PY'
          import importlib.metadata

          for name in (
              "torch",
              "transformers",
              "ms-swift",
              "peft",
              "deepspeed",
              "datasets",
              "qwen-vl-utils",
              "decord",
              "flash-attn",
          ):
              try:
                  print(f"{name}={importlib.metadata.version(name)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{name}=MISSING")
          PY
          python3 -c 'import torch, transformers, swift; print("IMPORT_OK", torch.__version__, torch.version.cuda, transformers.__version__)'
          echo OFFICIAL_IMAGE_INSPECT_OK
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "1"
            memory: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - gp-engine.beocat.ksu.edu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
