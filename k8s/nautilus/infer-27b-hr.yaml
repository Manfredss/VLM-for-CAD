apiVersion: apps/v1
kind: Deployment
metadata:
  name: wenfei-infer-27b-hr
  namespace: nsf-maica
  labels:
    k8s-app: wenfei-infer-27b-hr
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: wenfei-infer-27b-hr
  template:
    metadata:
      labels:
        k8s-app: wenfei-infer-27b-hr
    spec:
      containers:
      - name: exp-con
        image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /workspace
          name: workspace
        resources:
          limits:
            memory: 64Gi
            cpu: 8
            nvidia.com/gpu: 2
          requests:
            memory: 64Gi
            cpu: 8
            nvidia.com/gpu: 2
        env:
        - name: HF_HOME
          value: "/workspace/.cache/huggingface"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: TMPDIR
          value: "/workspace/tmp"
        - name: TEMP
          value: "/workspace/tmp"
        - name: TMP
          value: "/workspace/tmp"
        - name: TRITON_CACHE_DIR
          value: "/workspace/.cache/triton"
        - name: XDG_CACHE_HOME
          value: "/workspace/.cache"
        - name: LD_LIBRARY_PATH
          value: "/workspace/venv/lib/python3.11/site-packages/nvidia/cu13/lib"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "64Gi"
      - name: workspace
        persistentVolumeClaim:
          claimName: qwf-workspace
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-H100-80GB-HBM3
                - NVIDIA-H100-PCIe
                - NVIDIA-H100-NVL
                - NVIDIA-H100-SXM5-80GB
                - NVIDIA-H200
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-6000-Ada-Generation
                - NVIDIA-A40
                - NVIDIA-RTX-PRO-6000-Blackwell-Workstation-Edition
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
