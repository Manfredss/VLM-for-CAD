- apiVersion: batch/v1
  kind: Job
  metadata:
    name: wenfei-prewarm-q36val-mizzou1-20260721
    namespace: nsf-maica
    labels: &labels
      app: wenfei-prewarm-q36val-20260721
  spec: &job-spec
    backoffLimit: 0
    ttlSecondsAfterFinished: 3600
    template:
      metadata:
        labels: *labels
      spec:
        restartPolicy: Never
        nodeSelector:
          kubernetes.io/hostname: gpn-fiona-mizzou-1.rnet.missouri.edu
        tolerations: &tolerations
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        containers:
        - &container
          name: prewarm
          image: modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope:ubuntu22.04-cuda12.8.1-py311-torch2.9.0-vllm0.13.0-modelscope1.33.0-swift3.12.5
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc", "python --version && echo PREWARM_OK"]
          resources:
            requests: &resources
              cpu: "500m"
              memory: 1Gi
            limits: *resources
