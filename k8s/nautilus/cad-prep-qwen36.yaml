apiVersion: v1
kind: Pod
metadata:
  name: cad-prep-qwen36
  namespace: nsf-maica
spec:
  restartPolicy: Never
  containers:
  - name: prep
    image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest
    command: ["bash", "-lc", "sleep 21600"]
    env:
    - name: HF_HOME
      value: /workspace/.cache/huggingface
    - name: XDG_CACHE_HOME
      value: /workspace/.cache
    - name: PIP_CACHE_DIR
      value: /workspace/.cache/pip
    - name: TMPDIR
      value: /workspace/tmp
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    resources:
      requests:
        cpu: "8"
        memory: 32Gi
      limits:
        cpu: "8"
        memory: 32Gi
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: qwf-workspace
