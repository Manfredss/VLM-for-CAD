apiVersion: v1
kind: Pod
metadata:
  name: cad-scripts-v5-materializer
  namespace: nsf-maica
spec:
  restartPolicy: Never
  containers:
  - name: materializer
    image: busybox:latest
    command:
    - sh
    - -lc
    - |
      set -eu
      test "$(sha256sum /inputs/scripts-v5.tgz | cut -d' ' -f1)" = "9c189e22e2038b7a9d15bb6903f441bb6d9b7757af4eb4f43c37ac7d1fb184ba"
      tar -xzf /inputs/scripts-v5.tgz -C /workspace
      grep -q 'GPU_GUARD_MIN_PERCENT=' /workspace/qwen27b_cad_three_stage/gpu_guarded_train.sh
      grep -q 'USE_LOGITS_TO_KEEP=' /workspace/qwen27b_cad_three_stage/train_27b.sh
      echo SCRIPTS_V5_OK
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: scripts-v5
      mountPath: /inputs
      readOnly: true
    resources:
      requests:
        memory: 128Mi
        cpu: "1"
      limits:
        memory: 256Mi
        cpu: "1"
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: qwf-workspace
  - name: scripts-v5
    configMap:
      name: cad-upload-20260713-scripts-v5
