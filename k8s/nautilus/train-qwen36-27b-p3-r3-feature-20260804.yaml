apiVersion: batch/v1
kind: Job
metadata:
  name: wenfei-qwen36-p3-r3-feature-20260804
  namespace: nsf-maica
  labels:
    app: wenfei-qwen36-p3-r3-feature-20260804
    experiment: qwen36-p3-r3-dual-adapter
    task: feature
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wenfei-qwen36-p3-r3-feature-20260804
        experiment: qwen36-p3-r3-dual-adapter
        task: feature
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
              - key: kubernetes.io/hostname
                operator: In
                values:
                - node-2-2.sdsc.optiputer.net
                - gpengine-uark.areon.net
                - gpengine-uams.areon.net
                - nautilus-it-gpu08.fullerton.edu
                - nautilus-it-gpu07.fullerton.edu
                - rci-nrp-gpu-03.sdsu.edu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: qwf-workspace
      - name: train-tools
        configMap:
          name: cad-p2-r2-train-tools-20260729
          defaultMode: 0555
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: scratch
        emptyDir: {}
      containers:
      - name: trainer
        image: modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope:ubuntu22.04-cuda12.8.1-py311-torch2.9.0-vllm0.13.0-modelscope1.33.0-swift3.12.5
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        - |
          set -Eeuo pipefail

          MODEL=/workspace/.cache/huggingface/hub/models--Qwen--Qwen3.6-27B/snapshots/6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
          INIT_ADAPTER=/workspace/output/qwen3.6-27b-cad-three-stage-v1-20260714-r6/phase_b/checkpoint-3000
          DATA_ROOT=/workspace/data/cad_p3_r3_dual_adapter_20260804
          TRAIN_DATA=${DATA_ROOT}/train_feature.jsonl
          VAL_DATA=${DATA_ROOT}/val_feature.jsonl
          OUTPUT_ROOT=/workspace/output/qwen3.6-27b-cad-p3-r3-dual-20260804/feature
          PHASE_OUTPUT=${OUTPUT_ROOT}/phase_b
          LOG=/workspace/logs/qwen36_27b_p3_r3_feature_20260804.log
          OVERLAY_TGZ=/workspace/wheelhouse/qwen36-swift413/qwen36-swift413-overlay.tgz
          FASTPATH_TGZ=/workspace/wheelhouse/qwen36-fastpath-20260721/fastpath-overlay.tgz
          TILELANG_TGZ=/workspace/wheelhouse/qwen36-tilelang-20260728/tilelang-overlay.tgz

          mkdir -p /scratch
          export CUDA_VISIBLE_DEVICES=0
          echo "=== GPU RESERVE BOOT ==="
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          python - <<'PY' &
          import signal
          import time

          import torch

          stop = False

          def request_stop(*_args):
              global stop
              stop = True

          signal.signal(signal.SIGTERM, request_stop)
          signal.signal(signal.SIGINT, request_stop)
          device = torch.device("cuda:0")
          total = torch.cuda.get_device_properties(device).total_memory
          chunk = 256 * 1024**2
          target_total = int(total * 0.55)
          release_at = int(total * 0.52)
          buffers = []
          allocated = 0
          started = time.time()
          ready_samples = 0
          while allocated + chunk <= target_total:
              buffers.append(torch.empty(chunk, dtype=torch.uint8, device=device))
              allocated += chunk
          torch.cuda.synchronize(device)
          print(
              f"GPU_RESERVE_READY allocated={allocated // 1024**2}MiB "
              f"target_total={target_total // 1024**2}MiB",
              flush=True,
          )
          last_log = 0.0
          while not stop and time.time() - started < 900:
              free, current_total = torch.cuda.mem_get_info(device)
              external = max(0, current_total - free - allocated)
              if external >= release_at:
                  ready_samples += 1
              else:
                  ready_samples = 0
              if ready_samples >= 3:
                  print(
                      f"GPU_RESERVE_RELEASE external={external // 1024**2}MiB",
                      flush=True,
                  )
                  break
              desired = max(0, target_total - external)
              changed = False
              while allocated > desired + chunk and buffers:
                  buffers.pop()
                  allocated -= chunk
                  changed = True
              if changed:
                  torch.cuda.empty_cache()
              while allocated + chunk <= desired:
                  try:
                      buffers.append(torch.empty(chunk, dtype=torch.uint8, device=device))
                      allocated += chunk
                  except torch.OutOfMemoryError:
                      torch.cuda.empty_cache()
                      break
              now = time.time()
              if now - last_log >= 30:
                  print(
                      f"GPU_RESERVE reserve={allocated // 1024**2}MiB "
                      f"external={external // 1024**2}MiB ready_samples={ready_samples}",
                      flush=True,
                  )
                  last_log = now
              time.sleep(1)
          PY
          reserve_pid=$!
          reserve_percent=0
          for _ in $(seq 1 90); do
            kill -0 "${reserve_pid}" 2>/dev/null
            reserve_sample="$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | head -n 1)"
            reserve_used="$(echo "${reserve_sample}" | cut -d',' -f1 | tr -d ' ')"
            reserve_total="$(echo "${reserve_sample}" | cut -d',' -f2 | tr -d ' ')"
            reserve_percent=$((reserve_used * 100 / reserve_total))
            if [ "${reserve_percent}" -ge 50 ]; then
              echo "GPU_RESERVE_CONFIRMED memory=${reserve_used}/${reserve_total}MiB(${reserve_percent}%)"
              break
            fi
            sleep 1
          done
          test "${reserve_percent}" -ge 50

          mkdir -p /workspace/logs "${OUTPUT_ROOT}"
          exec > >(tee -a "${LOG}") 2>&1

          cleanup_reserve() {
            kill -TERM "${reserve_pid}" 2>/dev/null || true
            wait "${reserve_pid}" 2>/dev/null || true
          }
          trap cleanup_reserve EXIT TERM INT

          echo "=== PRECHECK ==="
          test -d "${MODEL}"
          test -f "${INIT_ADAPTER}/adapter_model.safetensors"
          test -s "${TRAIN_DATA}"
          test -s "${VAL_DATA}"
          test "$(wc -l < "${TRAIN_DATA}")" -eq 640
          test "$(wc -l < "${VAL_DATA}")" -eq 64
          test "$(sha256sum "${TRAIN_DATA}" | cut -d' ' -f1)" = "50f2237edf9c55b11c40418fd486ac75b11770c974144adf243628359a422b43"
          test "$(sha256sum "${VAL_DATA}" | cut -d' ' -f1)" = "f565aa0efd758cc5814a0617831e431611b8531f0810e94f1868911563f60fe0"
          test "$(sha256sum "${OVERLAY_TGZ}" | cut -d' ' -f1)" = "010778c94e9e699e280098a0856934ec3482c1912aff2577c8d07e13d199ce63"
          test "$(sha256sum "${FASTPATH_TGZ}" | cut -d' ' -f1)" = "b5f479ea1510e9575a6a166ac852860da70496e4b2a89f71b244bf934f2ed9ff"
          test "$(sha256sum "${TILELANG_TGZ}" | cut -d' ' -f1)" = "b91535b73774cf16c7230fefb3dd61099190e603a1627b317dd17fce493ff3e4"
          test "$(sha256sum /train-tools/train_27b.sh | cut -d' ' -f1)" = "6791a265c736736f724ef6fa481ecc09366d3840f06dd0ac3e87ef43c2515e5f"
          test "$(sha256sum /train-tools/gpu_guarded_train.sh | cut -d' ' -f1)" = "3c7268f440da266fcd8bc842bf482458cf65a02694d9f4e1119daaa95aacaa29"
          test "$(sha256sum /train-tools/optimizer.py | cut -d' ' -f1)" = "b217a65545397b9610483e93cf77c437769755c2a8e3556635c256a27a8cd9e7"
          if [ -d "${PHASE_OUTPUT}" ] && find "${PHASE_OUTPUT}" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "ERROR: output already exists and is non-empty: ${PHASE_OUTPUT}"
            exit 2
          fi

          tar -xzf "${OVERLAY_TGZ}" -C /scratch
          mkdir -p /scratch/fastpath /scratch/tilelang
          tar -xzf "${FASTPATH_TGZ}" -C /scratch/fastpath
          tar -xzf "${TILELANG_TGZ}" -C /scratch/tilelang
          Z3_LIB_DIR="$(find /scratch/tilelang -type f -name 'libz3.so.4.15' -printf '%h\n' | head -1)"
          test -n "${Z3_LIB_DIR}"
          export LD_LIBRARY_PATH="${Z3_LIB_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          export PYTHONPATH=/scratch/tilelang:/scratch/fastpath:/scratch/overlay:/train-tools
          export SWIFT_BIN=/usr/local/bin/swift
          export HF_HOME=/workspace/.cache/huggingface
          export TRANSFORMERS_CACHE=/workspace/.cache/huggingface
          export HUGGINGFACE_HUB_CACHE=/workspace/.cache/huggingface/hub
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          export HF_ENABLE_PARALLEL_LOADING=true
          export HF_PARALLEL_LOADING_WORKERS=8
          export TOKENIZERS_PARALLELISM=false
          export XDG_CACHE_HOME=/workspace/.cache
          export PIP_CACHE_DIR=/workspace/.cache/pip
          export TRITON_CACHE_DIR=/workspace/.cache/triton
          export TMPDIR=/scratch
          export TEMP=/scratch
          export TMP=/scratch
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

          export MODEL TRAIN_FULL_DATASET="${TRAIN_DATA}" VAL_DATASET="${VAL_DATA}"
          export OUTPUT_ROOT PHASE_B_OUTPUT="${PHASE_OUTPUT}" LOG_DIR="${OUTPUT_ROOT}/logs"
          export PHASE_A_ADAPTER="${INIT_ADAPTER}"
          export PHASE_B_USE_CROP_DATA=false PHASE_B_FREEZE_VIT=true PHASE_B_FREEZE_ALIGNER=true
          export PHASE_B_EPOCHS=1.0 PHASE_B_LLM_LR=1.5e-7 PHASE_B_ALIGNER_LR=0 PHASE_B_VIT_LR=0
          export CAD_FREEZE_ALIGNER=true CAD_FREEZE_VIT=true
          export TARGET_MODULES=q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj,out_proj,in_proj_qkv,in_proj_z,in_proj_b,in_proj_a
          export CUDA_VISIBLE_DEVICES=0 NPROC_PER_NODE=1
          export PER_DEVICE_TRAIN_BATCH_SIZE=1 PER_DEVICE_EVAL_BATCH_SIZE=1 GRADIENT_ACCUMULATION_STEPS=8
          export MAX_LENGTH=8192 IMAGE_MAX_TOKEN_NUM=2048
          export DATASET_NUM_PROC=2 DATALOADER_NUM_WORKERS=2
          export EVAL_STEPS=20 SAVE_STEPS=20 SAVE_TOTAL_LIMIT=5 LOGGING_STEPS=5
          export WARMUP_RATIO=0.05 LOAD_BEST_MODEL_AT_END=false
          export SKIP_SWIFT_HELP=true USE_LOGITS_TO_KEEP=true RUN_PREFLIGHT=false ALLOW_NONEMPTY_OUTPUT=false
          export DEEPSPEED_CONFIG=zero3
          export GPU_GUARD_MIN_PERCENT=50 GPU_GUARD_GRACE_SECONDS=30 GPU_GUARD_LOW_SECONDS=60 GPU_GUARD_INTERVAL_SECONDS=15

          echo "=== GPU ==="
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          python -c "from importlib.metadata import version; import fla, causal_conv1d, tilelang; print('FASTPATH', version('flash-linear-attention'), version('fla-core'), version('causal-conv1d'), 'tilelang', version('tilelang'))"
          echo "=== P3-R3 FEATURE ADAPTER ==="
          echo "train=$(wc -l < "${TRAIN_DATA}") val=$(wc -l < "${VAL_DATA}") epochs=${PHASE_B_EPOCHS} expected_steps=80"
          cd /train-tools
          # DeepSpeed constructs this 27B model in large bursts. Release the
          # startup reserve synchronously to prevent the two allocators from
          # colliding; the guarded trainer must reach 50% within 90 seconds.
          cleanup_reserve
          trap - EXIT TERM INT
          echo "GPU_RESERVE_RELEASED before trainer launch"
          set +e
          bash gpu_guarded_train.sh phase_b
          status=$?
          set -e
          exit "${status}"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: train-tools
          mountPath: /train-tools
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
        - name: scratch
          mountPath: /scratch
        resources:
          requests:
            cpu: "4"
            memory: 128Gi
            ephemeral-storage: 4Gi
            nvidia.com/a100: "1"
          limits:
            cpu: "4"
            memory: 128Gi
            ephemeral-storage: 4Gi
            nvidia.com/a100: "1"
