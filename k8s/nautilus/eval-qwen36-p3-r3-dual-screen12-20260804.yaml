apiVersion: batch/v1
kind: Job
metadata:
  name: wenfei-qwen36-p3-r3-dual-screen12-20260804
  namespace: nsf-maica
  labels:
    app: wenfei-qwen36-p3-r3-dual-screen12-20260804
    experiment: qwen36-p3-r3-dual-screen12
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wenfei-qwen36-p3-r3-dual-screen12-20260804
        experiment: qwen36-p3-r3-dual-screen12
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
              - key: kubernetes.io/hostname
                operator: In
                values:
                - nautilus-it-gpu07.fullerton.edu
                - nautilus-it-gpu08.fullerton.edu
                - gpn-fiona-mizzou-5.rnet.missouri.edu
                - node-2-2.sdsc.optiputer.net
                - rci-nrp-gpu-03.sdsu.edu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: qwf-workspace
      - name: eval-tools
        configMap:
          name: cad-p3-r3-eval-tools-20260804
          defaultMode: 0555
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: scratch
        emptyDir: {}
      containers:
      - name: evaluator
        image: modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope:ubuntu22.04-cuda12.8.1-py311-torch2.9.0-vllm0.13.0-modelscope1.33.0-swift3.12.5
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        - |
          set -Eeuo pipefail

          MODEL=/workspace/.cache/huggingface/hub/models--Qwen--Qwen3.6-27B/snapshots/6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
          ROOT=/workspace/output/qwen3.6-27b-cad-p3-r3-dual-20260804
          LV_PHASE=${ROOT}/layout_view/phase_b
          F_PHASE=${ROOT}/feature/phase_b
          INPUT=/workspace/eval/qwen36-cad-20260729/p2-r2-screen12/full-v2048-r4/subset/val_screen12_three_stage.jsonl
          GROUND_TRUTH=/workspace/eval/qwen36-cad-20260729/p2-r2-screen12/full-v2048-r4/subset/val_screen12_ground_truth.jsonl
          OUTPUT=/workspace/eval/qwen36-cad-20260804/p3-r3-dual/screen12/combined
          LOG=/workspace/logs/qwen36_p3_r3_dual_screen12_combined_20260804.log
          OVERLAY_TGZ=/workspace/wheelhouse/qwen36-swift413/qwen36-swift413-overlay.tgz
          FASTPATH_TGZ=/workspace/wheelhouse/qwen36-fastpath-20260721/fastpath-overlay.tgz

          mkdir -p /scratch
          export CUDA_VISIBLE_DEVICES=0
          echo "=== GPU RESERVE BOOT combined LV20/LV40/LV80 ==="
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          python - <<'PY' &
          import signal
          import time

          import torch

          stop = False

          def request_stop(*_args):
              global stop
              stop = True

          signal.signal(signal.SIGTERM, request_stop)
          signal.signal(signal.SIGINT, request_stop)
          device = torch.device("cuda:0")
          total = torch.cuda.get_device_properties(device).total_memory
          chunk = 256 * 1024**2
          target_total = int(total * 0.55)
          minimum_reserve = 8 * 1024**3
          release_at = int(total * 0.52)
          buffers = []
          allocated = 0
          started = time.time()
          while allocated + chunk <= target_total:
              buffers.append(torch.empty(chunk, dtype=torch.uint8, device=device))
              allocated += chunk
          torch.cuda.synchronize(device)
          print(
              f"GPU_RESERVE_READY allocated={allocated // 1024**2}MiB "
              f"target_total={target_total // 1024**2}MiB",
              flush=True,
          )
          last_log = 0.0
          while not stop:
              free, current_total = torch.cuda.mem_get_info(device)
              external = max(0, current_total - free - allocated)
              if time.time() - started > 900 and external < release_at:
                  print(
                      f"GPU_RESERVE_TIMEOUT external={external // 1024**2}MiB",
                      flush=True,
                  )
                  break
              desired = max(minimum_reserve, target_total - external)
              changed = False
              while allocated > desired + chunk and buffers:
                  buffers.pop()
                  allocated -= chunk
                  changed = True
              if changed:
                  torch.cuda.empty_cache()
              while allocated + chunk <= desired:
                  try:
                      buffers.append(torch.empty(chunk, dtype=torch.uint8, device=device))
                      allocated += chunk
                  except torch.OutOfMemoryError:
                      torch.cuda.empty_cache()
                      break
              now = time.time()
              if now - last_log >= 30:
                  print(
                      f"GPU_RESERVE reserve={allocated // 1024**2}MiB "
                      f"external={external // 1024**2}MiB",
                      flush=True,
                  )
                  last_log = now
              time.sleep(0.2)
          PY
          reserve_pid=$!
          reserve_percent=0
          for _ in $(seq 1 90); do
            kill -0 "${reserve_pid}" 2>/dev/null
            sample="$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | head -n 1)"
            used="$(echo "${sample}" | cut -d',' -f1 | tr -d ' ')"
            total="$(echo "${sample}" | cut -d',' -f2 | tr -d ' ')"
            reserve_percent=$((used * 100 / total))
            if [ "${reserve_percent}" -ge 50 ]; then
              echo "GPU_RESERVE_CONFIRMED memory=${used}/${total}MiB(${reserve_percent}%)"
              break
            fi
            sleep 1
          done
          test "${reserve_percent}" -ge 50

          mkdir -p /workspace/logs /scratch "${OUTPUT}"
          exec > >(tee -a "${LOG}") 2>&1

          cleanup() {
            kill -TERM "${reserve_pid}" 2>/dev/null || true
            kill -TERM "${guard_pid:-}" 2>/dev/null || true
            wait "${reserve_pid}" 2>/dev/null || true
            wait "${guard_pid:-}" 2>/dev/null || true
          }
          trap cleanup EXIT TERM INT

          echo "=== PRECHECK ==="
          test -d "${MODEL}"
          test "$(wc -l < "${INPUT}")" -eq 12
          test "$(wc -l < "${GROUND_TRUTH}")" -eq 12
          for step in 20 40 80; do
            test -s "${LV_PHASE}/checkpoint-${step}/adapter_model.safetensors"
          done
          for step in 20 60 80; do
            test -s "${F_PHASE}/checkpoint-${step}/adapter_model.safetensors"
          done
          test "$(sha256sum "${OVERLAY_TGZ}" | cut -d' ' -f1)" = "010778c94e9e699e280098a0856934ec3482c1912aff2577c8d07e13d199ce63"
          test "$(sha256sum "${FASTPATH_TGZ}" | cut -d' ' -f1)" = "b5f479ea1510e9575a6a166ac852860da70496e4b2a89f71b244bf934f2ed9ff"
          test "$(sha256sum /eval-tools/infer_dual_adapters.py | cut -d' ' -f1)" = "c0a838a6dfd7f31d0e2a7b432a11a195836b70a6ac0638ffac605b858ea70aa9"
          test "$(sha256sum /eval-tools/infer_adapters.py | cut -d' ' -f1)" = "197e61f486217fbd3be2d7e5e2de217d78522b566f5196ea39414406ee0ed2e6"
          test "$(sha256sum /eval-tools/infer_three_stage.py | cut -d' ' -f1)" = "ca695316c5120aec8b96180108262f59cb55c0ca4300622df9a97b781316e1cf"
          test "$(sha256sum /eval-tools/evaluate_predictions.py | cut -d' ' -f1)" = "780dfae59bdbfc03f26d492fe847750e48eaef6180f32de13936e5f2cde204df"
          test "$(sha256sum /eval-tools/metrics.py | cut -d' ' -f1)" = "cc32ba67e4595512fe73c7a0c7895219a8e00413b8d97906ee625a98668d2461"
          test "$(sha256sum /eval-tools/cad_schema.py | cut -d' ' -f1)" = "6ed486d45a8bbb2a7ef8f7dfd9dc35bf7b37340c0f40fb1e85f8774ada1f0dc9"

          tar -xzf "${OVERLAY_TGZ}" -C /scratch
          mkdir -p /scratch/fastpath
          tar -xzf "${FASTPATH_TGZ}" -C /scratch/fastpath
          export PYTHONPATH=/scratch/fastpath:/scratch/overlay:/eval-tools
          export HF_HOME=/workspace/.cache/huggingface
          export TRANSFORMERS_CACHE=/workspace/.cache/huggingface
          export HUGGINGFACE_HUB_CACHE=/workspace/.cache/huggingface/hub
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          export HF_ENABLE_PARALLEL_LOADING=true
          export HF_PARALLEL_LOADING_WORKERS=2
          export TOKENIZERS_PARALLELISM=false
          export XDG_CACHE_HOME=/workspace/.cache
          export TMPDIR=/scratch
          export TEMP=/scratch
          export TMP=/scratch
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

          guard_gpu() {
            main_pid="$1"
            sleep 240
            low_seconds=0
            while kill -0 "${main_pid}" 2>/dev/null; do
              sample="$(nvidia-smi --query-gpu=memory.used,memory.total,utilization.gpu --format=csv,noheader,nounits | head -n 1)"
              used="$(echo "${sample}" | cut -d',' -f1 | tr -d ' ')"
              total="$(echo "${sample}" | cut -d',' -f2 | tr -d ' ')"
              util="$(echo "${sample}" | cut -d',' -f3 | tr -d ' ')"
              memory_percent=$((used * 100 / total))
              echo "GPU_GUARD memory=${used}/${total}MiB(${memory_percent}%) util=${util}%"
              if [ "${memory_percent}" -ge 50 ] || [ "${util}" -ge 50 ]; then
                low_seconds=0
              else
                low_seconds=$((low_seconds + 30))
                if [ "${low_seconds}" -ge 90 ]; then
                  echo "GPU_GUARD_FATAL low load for ${low_seconds}s"
                  kill -TERM "${main_pid}" 2>/dev/null || true
                  return 42
                fi
              fi
              sleep 30
            done
          }

          echo "=== P3-R3 TRUE DUAL-ADAPTER SCREEN-12 COMBINED ==="
          python /eval-tools/infer_dual_adapters.py \
            --model-path "${MODEL}" \
            --layout-adapter "lv20=${LV_PHASE}/checkpoint-20" \
            --layout-adapter "lv40=${LV_PHASE}/checkpoint-40" \
            --layout-adapter "lv80=${LV_PHASE}/checkpoint-80" \
            --feature-adapter "f20=${F_PHASE}/checkpoint-20" \
            --feature-adapter "f60=${F_PHASE}/checkpoint-60" \
            --feature-adapter "f80=${F_PHASE}/checkpoint-80" \
            --combination lv20:f60 \
            --combination lv40:f60 \
            --combination lv80:f60 \
            --combination lv80:f20 \
            --combination lv80:f80 \
            --input-jsonl "${INPUT}" \
            --ground-truth "${GROUND_TRUTH}" \
            --output-dir "${OUTPUT}" \
            --device-map single \
            --image-max-tokens 2048 \
            --step1-max-new-tokens 1536 \
            --step2-max-new-tokens 1536 \
            --step3-max-new-tokens 3072 \
            --limit 12 \
            --save-raw \
            --save-every 1 \
            --fail-fast &
          main_pid=$!
          guard_gpu "${main_pid}" &
          guard_pid=$!
          set +e
          wait "${main_pid}"
          status=$?
          set -e
          kill -TERM "${guard_pid}" 2>/dev/null || true
          wait "${guard_pid}" 2>/dev/null || true
          test "${status}" -eq 0
          test -s "${OUTPUT}/dual_adapter_ranking.json"
          echo "SCREEN12_COMBINED_COMPLETE"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: eval-tools
          mountPath: /eval-tools
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
        - name: scratch
          mountPath: /scratch
        resources:
          requests:
            cpu: "1"
            memory: 128Gi
            ephemeral-storage: 4Gi
            nvidia.com/a100: "1"
          limits:
            cpu: "1"
            memory: 128Gi
            ephemeral-storage: 4Gi
            nvidia.com/a100: "1"
