apiVersion: batch/v1
kind: Job
metadata:
  name: wenfei-prp-base-qwen36-inspect-20260713
  namespace: nsf-maica
  labels:
    app: wenfei-prp-base-qwen36-inspect-20260713
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wenfei-prp-base-qwen36-inspect-20260713
    spec:
      restartPolicy: Never
      containers:
      - name: inspect
        image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest
        command:
        - bash
        - -lc
        - |
          set -Eeuo pipefail
          echo "PYTHON=$(command -v python3)"
          python3 -V
          python3 - <<'PY'
          import importlib.metadata

          for name in (
              "torch",
              "transformers",
              "ms-swift",
              "peft",
              "deepspeed",
              "datasets",
              "qwen-vl-utils",
              "decord",
              "flash-attn",
          ):
              try:
                  print(f"{name}={importlib.metadata.version(name)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{name}=MISSING")
          PY
          python3 -c 'import torch; print("torch_import_ok", torch.__version__, torch.version.cuda)'
          echo BASE_INSPECT_OK
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "1"
            memory: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - gp-engine.beocat.ksu.edu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
