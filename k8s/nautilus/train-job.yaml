apiVersion: batch/v1
kind: Job
metadata:
  name: train-job
  namespace: nsf-maica
spec:
  backoffLimit: 2          # 失败最多重试次数
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: storage
        persistentVolumeClaim:
          claimName: training-storage

      containers:
      - name: trainer
        # 替换为你自己的镜像，或使用 Nautilus 提供的 PyTorch 镜像
        image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
        # image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest

        command:
        - bash
        - -c
        - |
          cd /storage
          # 示例：torchrun 单节点多卡启动
          torchrun \
            --nproc_per_node=4 \
            --nnodes=1 \
            train.py \
            --data_dir /storage/data \
            --output_dir /storage/checkpoints \
            --epochs 100 \
            --batch_size 32

        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /storage
          name: storage

        resources:
          limits:
            memory: "200Gi"
            cpu: "32"
            nvidia.com/gpu: "4"
          requests:
            memory: "100Gi"
            cpu: "16"
            nvidia.com/gpu: "4"

        env:
        - name: NCCL_DEBUG
          value: INFO
        - name: PYTHONUNBUFFERED
          value: "1"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-L4
                # 可选其他 GPU 型号:
                # - NVIDIA-A10
                # - NVIDIA-A100-SXM4-80GB
                # - NVIDIA-A40
