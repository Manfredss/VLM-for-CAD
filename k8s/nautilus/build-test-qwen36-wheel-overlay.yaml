apiVersion: batch/v1
kind: Job
metadata:
  name: wenfei-qwen36-wheel-overlay-20260713
  namespace: nsf-maica
  labels:
    app: wenfei-qwen36-wheel-overlay-20260713
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wenfei-qwen36-wheel-overlay-20260713
    spec:
      restartPolicy: Never
      containers:
      - name: builder
        image: modelscope-registry.cn-hangzhou.cr.aliyuncs.com/modelscope-repo/modelscope:ubuntu22.04-cuda12.8.1-py311-torch2.9.0-vllm0.13.0-modelscope1.33.0-swift3.12.5
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        - |
          set -Eeuo pipefail
          WHEELHOUSE=/workspace/wheelhouse/qwen36-swift413
          OVERLAY=/scratch/overlay
          mkdir -p "${WHEELHOUSE}" "${OVERLAY}"
          echo "=== DOWNLOAD WHEELS ==="
          python3 -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --dest "${WHEELHOUSE}" \
            'ms-swift==4.1.3' \
            'transformers==5.6.2' \
            'peft==0.18.1' \
            'huggingface-hub>=1.5.0,<2.0' \
            'regex>=2025.10.22' \
            'mistral-common>=1.10.0'
          sha256sum "${WHEELHOUSE}"/*.whl

          echo "=== LOCAL NVME INSTALL BENCHMARK ==="
          START=$(date +%s)
          python3 -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --target "${OVERLAY}" \
            "${WHEELHOUSE}"/*.whl
          END=$(date +%s)
          echo "OVERLAY_INSTALL_SECONDS=$((END - START))"

          export PYTHONPATH="${OVERLAY}:/workspace/qwen27b_cad_three_stage"
          python3 - <<'PY'
          import importlib.metadata
          import peft
          import swift
          import transformers

          print("ms-swift", importlib.metadata.version("ms-swift"))
          print("transformers", transformers.__version__)
          print("peft", peft.__version__)
          PY

          echo "=== QWEN3.6 PROCESSOR/PLUGIN SMOKE ==="
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          START=$(date +%s)
          python3 - <<'PY'
          import importlib.metadata

          import optimizer  # noqa: F401
          from transformers import AutoConfig, AutoProcessor

          model = "/workspace/.cache/huggingface/hub/models--Qwen--Qwen3.6-27B/snapshots/6a9e13bd6fc8f0983b9b99948120bc37f49c13e9"
          config = AutoConfig.from_pretrained(model, local_files_only=True)
          processor = AutoProcessor.from_pretrained(model, local_files_only=True)
          print("model_type", config.model_type)
          print("processor", type(processor).__name__)
          print("mistral-common", importlib.metadata.version("mistral-common"))
          PY
          END=$(date +%s)
          echo "PROCESSOR_SMOKE_SECONDS=$((END - START))"

          echo "=== LOCAL IMPORT BENCHMARK ==="
          START=$(date +%s)
          /usr/local/bin/swift sft --help >/scratch/swift-sft-help.txt
          END=$(date +%s)
          echo "SWIFT_HELP_SECONDS=$((END - START))"
          echo "=== PACKAGE OVERLAY ==="
          tar -C /scratch -czf "${WHEELHOUSE}/qwen36-swift413-overlay.tgz" overlay
          sha256sum "${WHEELHOUSE}/qwen36-swift413-overlay.tgz"
          ls -lh "${WHEELHOUSE}/qwen36-swift413-overlay.tgz"
          echo WHEEL_OVERLAY_OK
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        - mountPath: /scratch
          name: scratch
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 2Gi
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: qwf-workspace
      - name: scratch
        emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - gp-engine.beocat.ksu.edu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
