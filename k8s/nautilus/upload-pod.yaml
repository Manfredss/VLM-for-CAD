apiVersion: v1
kind: Pod
metadata:
  name: upload-helper
  namespace: nsf-maica
spec:
  restartPolicy: Never
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: qwf-workspace
  containers:
  - name: helper
    image: busybox:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    resources:
      requests:
        memory: "256Mi"
        cpu: "1"
      limits:
        memory: "512Mi"
        cpu: "1"
