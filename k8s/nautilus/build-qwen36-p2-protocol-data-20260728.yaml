apiVersion: batch/v1
kind: Job
metadata:
  name: wenfei-qwen36-p2-data-20260728
  namespace: nsf-maica
  labels:
    app: wenfei-qwen36-p2-data-20260728
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wenfei-qwen36-p2-data-20260728
    spec:
      restartPolicy: Never
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: qwf-workspace
      - name: p2-tools
        configMap:
          name: cad-p2-data-tools-20260728
          defaultMode: 0555
      containers:
      - name: builder
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        - |
          set -Eeuo pipefail
          SOURCE=/workspace/data/cad_three_stage_v1_20260713
          OUTPUT=/workspace/data/cad_p2_protocol_v1_20260728
          test -s "${SOURCE}/train_three_stage.jsonl"
          test -s "${SOURCE}/val_three_stage.jsonl"
          PYTHONPATH=/p2-tools python /p2-tools/build_p2_protocol_dataset.py \
            --train-input "${SOURCE}/train_three_stage.jsonl" \
            --val-input "${SOURCE}/val_three_stage.jsonl" \
            --output-dir "${OUTPUT}" \
            --train-feature-replay-ratio 0.20 \
            --val-feature-replay-ratio 0.0
          wc -l "${OUTPUT}/train_p2_protocol.jsonl" "${OUTPUT}/val_p2_protocol.jsonl"
          sha256sum "${OUTPUT}/train_p2_protocol.jsonl" "${OUTPUT}/val_p2_protocol.jsonl"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: p2-tools
          mountPath: /p2-tools
          readOnly: true
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 4Gi
