apiVersion: apps/v1
kind: Deployment
metadata:
  name: wenfeiqwen3-5-27b-2a100-a
  namespace: nsf-maica
  labels:
    k8s-app: wenfei-2a100
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: wenfei-2a100
  template:
    metadata:
      labels:
        k8s-app: wenfei-2a100
    spec:
      containers:
      - name: exp-con
        image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /workspace
          name: workspace
        resources:
          limits:
            memory: 160Gi
            cpu: 8
            nvidia.com/a100: 2
          requests:
            memory: 160Gi
            cpu: 8
            nvidia.com/a100: 2
        env:
        - name: HF_HOME
          value: "/workspace/.cache/huggingface"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: TMPDIR
          value: "/workspace/tmp"
        - name: TEMP
          value: "/workspace/tmp"
        - name: TMP
          value: "/workspace/tmp"
        - name: TRITON_CACHE_DIR
          value: "/workspace/.cache/triton"
        - name: PIP_CACHE_DIR
          value: "/workspace/.cache/pip"
        - name: XDG_CACHE_HOME
          value: "/workspace/.cache"
        - name: LD_LIBRARY_PATH
          value: "/workspace/venv/lib/python3.11/site-packages/nvidia/cu13/lib"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "64Gi"
      - name: workspace
        persistentVolumeClaim:
          claimName: qwf-workspace
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
